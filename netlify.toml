[[headers]]
  for = "/sw.js"
  [headers.values]
    # Never let a CDN/browser cache the service worker file itself — if it
    # did, a redeploy could sit invisible for ages before devices pick it up.
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
